<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nemesis Barbershop</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    line-height:1.6;
}


    
    
    
header{
    background:linear-gradient(-45deg,#000,#222,#444,#111);
    background-size:400% 400%;
    animation:gradientMove 8s ease infinite;
    text-align:center;
    padding:80px 20px;
}
@keyframes gradientMove{
    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}
h1{
    color:#FFD700;
    font-size:42px;
    margin-bottom:15px;
}

h2{
    color:#FFD700;
    margin-bottom:20px;
}

section{
    padding:50px 20px;
    text-align:center;
}
.service{
    max-width:350px;
    margin:20px auto;
    background:#222;
    padding:20px;
    border-radius:15px;
    font-size:24px;
    transition:0.3s;
    box-shadow:0 0 15px rgba(255,215,0,.15);
}

.service:hover{
    transform:translateY(-8px);
    background:#333;
    box-shadow:0 0 30px gold;
    

    
    
.service h3{
    color:#FFD700;
    margin-bottom:10px;
}

.service p{
    font-size:22px;
    font-weight:bold;
    color:white;
}


    
    
    

    
    
    
    
    
a{
    display:inline-block;
    margin-top:25px;
    background:#FFD700;
    color:black;
    text-decoration:none;
    padding:18px 35px;
    border-radius:10px;
    font-weight:bold;
    font-size:20px;
    transition:0.3s;
    box-shadow:0 0 20px rgba(255,215,0,.6);
    animation:buttonGlow 2s infinite alternate;
}


    
a:hover{
    background:white;
    transform:scale(1.08);
    box-shadow:0 0 35px gold;
}
@keyframes buttonGlow{
    from{
        box-shadow:0 0 15px rgba(255,215,0,.4);
    }

    to{
        box-shadow:0 0 35px rgba(255,215,0,1);
    }
}
footer{
    background:#000;
    text-align:center;
    padding:20px;
    margin-top:40px;
}
</style>
</head>


<body>

<header>
    <h1>💈 Nemesis Barbershop</h1>
    <p>Fresh Cuts • Sharp Style • Professional Grooming</p>

    <a href="https://wa.me/254115786763">
        Book an Appointment
    </a>
</header>


    

    
    
    
    
<section>
    <h2>Our Services</h2>

    
        
    <div class="service">
    <h3>✂️ Haircut</h3>
    <p>KSh 300</p>
</div>

    
        
    <div class="service">
    <h3>🧔 Beard Trim</h3>
    <p>KSh 200</p>
</div>

    
        
    <div class="service">
    <h3>🪒 Clean Shave</h3>
    <p>KSh 250</p>
</div>

    
        
    <div class="service">
    <h3>👦 Kids Haircut</h3>
    <p>KSh 250</p>
</div>

</section>


    

    
    
<section>
    <h2>🕒 Opening Hours</h2>

    <div class="service">
        <h3>Monday – Saturday</h3>
        <p>8:00 AM – 8:00 PM</p>
    </div>
</section>

<footer>
    <p>© 2026 Nemesis Barbershop</p>
</footer>

</body>
</html>
